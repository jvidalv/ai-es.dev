name: News to Discord
# Discord consumer of the daily news record. It reacts to the same push that makes Railway rebuild the site.
on:
  push:
    branches: [main]
    paths:
      - "packages/content/news/*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-discord
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.NEWS_DISCORD_TOKEN }}
      NEWS_CHANNEL_ID: ${{ vars.NEWS_CHANNEL_ID }}
      NEWS_ALERT_USER_ID: ${{ vars.NEWS_ALERT_USER_ID }}
    steps:
      - name: Skip until the repository has the Discord token
        if: env.DISCORD_TOKEN == ''
        run: echo "::notice::NEWS_DISCORD_TOKEN is not set. The same consumer runs from the generator host instead."
      - uses: actions/checkout@v4
        if: env.DISCORD_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.DISCORD_TOKEN != ''
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        if: env.DISCORD_TOKEN != ''
      - run: bun run news:discord
        if: env.DISCORD_TOKEN != ''
