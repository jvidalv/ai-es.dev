name: News to Discord
# Discord consumer of the daily news record. It reacts to the same push that makes Railway rebuild the site.
on:
  push:
    branches: [main]
    paths:
      - "packages/content/news/*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-discord
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the repository has the Discord token
        id: token
        env:
          DISCORD_TOKEN: ${{ secrets.NEWS_DISCORD_TOKEN }}
        run: |
          if [ -n "$DISCORD_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NEWS_DISCORD_TOKEN is not set. The same consumer runs from the generator host instead."
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      # The token is given to this step only, so dependency install scripts never see it.
      - run: bun run news:discord
        if: steps.token.outputs.present == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.NEWS_DISCORD_TOKEN }}
          NEWS_CHANNEL_ID: ${{ vars.NEWS_CHANNEL_ID }}
          NEWS_ALERT_USER_ID: ${{ vars.NEWS_ALERT_USER_ID }}
